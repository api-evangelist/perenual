naftiko: 1.0.0-alpha2
info:
  label: Perenual API — Care
  description: 'Perenual API — Care. 1 operations. Lead operation: List plant care guides. Self-contained Naftiko capability
    covering one Perenual business surface.'
  tags:
  - Perenual
  - Care
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PERENUAL_API_KEY: PERENUAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: perenual-care
    baseUri: https://perenual.com/api/v2
    description: Perenual API — Care business capability. Self-contained, no shared references.
    resources:
    - name: species-care-guide-list
      path: /species-care-guide-list
      operations:
      - name: getcareguides
        method: GET
        description: List plant care guides
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: species_id
          in: query
          type: integer
        - name: page
          in: query
          type: integer
        - name: q
          in: query
          type: string
        - name: type
          in: query
          type: string
    authentication:
      type: apikey
      key: key
      value: '{{env.PERENUAL_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: perenual-care-rest
    port: 8080
    description: REST adapter for Perenual API — Care. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/species-care-guide-list
      name: species-care-guide-list
      description: REST surface for species-care-guide-list.
      operations:
      - method: GET
        name: getcareguides
        description: List plant care guides
        call: perenual-care.getcareguides
        with:
          species_id: rest.species_id
          page: rest.page
          q: rest.q
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: perenual-care-mcp
    port: 9090
    transport: http
    description: MCP adapter for Perenual API — Care. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-plant-care-guides
      description: List plant care guides
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: perenual-care.getcareguides
      with:
        species_id: tools.species_id
        page: tools.page
        q: tools.q
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
