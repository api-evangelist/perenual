openapi: 3.1.0
info:
  title: Perenual Care API
  description: Perenual provides a comprehensive plant database API offering access to over 10,000+ plant species, including details on care, watering, sunlight, edibility, toxicity, pests, diseases, and care guides.
  version: '2.0'
  contact:
    name: Perenual API Support
    url: https://perenual.com/docs/api
servers:
- url: https://perenual.com/api/v2
  description: Production
security:
- apiKeyAuth: []
tags:
- name: Care
  description: Plant care guides
paths:
  /species-care-guide-list:
    get:
      operationId: getCareGuides
      summary: List plant care guides
      description: Returns plant care guides (Supreme tier).
      tags:
      - Care
      parameters:
      - name: species_id
        in: query
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: q
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Tier required
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: query
      name: key
externalDocs:
  description: Documentation
  url: https://perenual.com/docs/api
